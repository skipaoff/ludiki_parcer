# VFP: Every push and pull request proves the terminal's code, interface build and database schema still work.
# Changes when: the Python or Node version range, the operating systems, the database image or the checked artifacts change.
# Anti-goal:
# 1. Real exchange API keys or calls to live exchanges in CI.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10
      - run: uv sync --frozen --python ${{ matrix.python-version }}
      - run: uv run --frozen --python ${{ matrix.python-version }} pytest -q

  web:
    name: Interface build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-fund --no-audit
      - run: npm run build

  db-schema:
    name: Database schema (PostgreSQL 18 + TimescaleDB)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:2.30.0-pg18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v5
      - name: Apply 001_schema.sql
        run: psql -v ON_ERROR_STOP=1 -f db/001_schema.sql
      - name: Apply 002_timescale.sql
        run: psql -v ON_ERROR_STOP=1 -f db/002_timescale.sql
      - name: Check hypertables and policies
        run: |
          psql -v ON_ERROR_STOP=1 -At -c "SELECT hypertable_name FROM timescaledb_information.hypertables ORDER BY 1"
          psql -v ON_ERROR_STOP=1 -At -c "SELECT proc_name, hypertable_name FROM timescaledb_information.jobs WHERE hypertable_name IS NOT NULL ORDER BY 1, 2"
      - uses: astral-sh/setup-uv@v10
      - name: Terminal migration runner on a fresh database
        run: |
          psql -v ON_ERROR_STOP=1 -c "CREATE DATABASE ludik_test"
          uv sync --frozen
          uv run --frozen pytest -q -m db
        env:
          LUDIK_TEST_DSN: postgresql://postgres:postgres@localhost:5432/ludik_test
