# Настройки терминала на сервере. Отличия от домашней машины помечены комментариями.
# Секреты сюда не пишутся: на сервере они приходят из окружения (/etc/ludik/ludik.env).

[server]
host = "127.0.0.1"
port = 8765
open_browser = false        # на сервере некому открывать браузер

[paths]
data_dir = "/opt/ludik/ludik-data"
spool_dir = "/opt/ludik/ludik-data/spool"
logs_dir = "/opt/ludik/ludik-data/logs"
web_dist = "web/dist"

[database]
host = "127.0.0.1"
port = 5432
name = "ludik"
user = "ludik"
autostart = false           # кластером управляет systemd, а не терминал

[trading]
enabled = false             # сервер в режиме наблюдателя: ключей бирж на нём нет

[telegram]
enabled = true
chats = []                  # id чатов и каналов; токен бота — в /etc/ludik/ludik.env
min_interest = 0                # слать только пары с интересом не ниже (0 — не фильтровать)
# min_total_pct = 1.5           # и только с итогом не ниже, в процентах
max_total_pct = 15              # выше — сломанная цена, а не вилка
min_volume24h_usd = 20000       # оборот слабой ноги за сутки: тот же порог, что в фильтрах ленты
# min_capacity_usd = 100        # сколько денег должно влезать в стакан; пусто — размер сделки целиком
quiet_hours = ""
digest_at = "09:00"
alarms = true
send_outcome = true
max_messages_per_hour = 60
