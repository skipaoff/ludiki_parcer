# Terminal ludik — non-secret settings.
# Copy to config.toml and edit. API keys and passwords never go here: they live in the credential store of the
# system — Credential Manager on Windows, the login keychain on macOS.
# Relative paths are resolved against the folder of this file.

[server]
host = "127.0.0.1"          # only loopback: the terminal must not be reachable from the network
port = 8765
open_browser = true
dev_ui_port = 5173          # Vite dev server allowed as an origin during interface development

[paths]
data_dir = "../ludik-data"  # outside the repository: database cluster, spool, logs
spool_dir = "../ludik-data/spool"
logs_dir = "../ludik-data/logs"
web_dist = "web/dist"

[database]
host = "127.0.0.1"
port = 5432
name = "ludik"
user = "ludik"
autostart = true            # start the local cluster with pg_ctl when it is not running
pg_bin_dir = "../ludik-data/pgsql/bin"   # Windows bundle; if it is not there, PATH and the Homebrew prefixes are searched
pg_data_dir = "../ludik-data/pgdata"
connect_timeout_s = 5

[storage]
flush_interval_ms = 300
max_batch_rows = 5000
reconnect_interval_s = 5

[ui]
snapshot_hz = 5
heartbeat_interval_s = 5
heartbeat_timeout_s = 15
journal_buffer = 500

[exchanges]
probe_interval_s = 10       # public ping and clock check of every exchange
request_timeout_s = 10
clock_warning_ms = 1000     # warn when the local clock drifts further from an exchange

[exchanges.binance]
enabled = true
demo = false                # true: Binance demo trading (demo-fapi.binance.com) with separate demo keys

[exchanges.mexc]
enabled = true

[exchanges.gate]
enabled = true

[exchanges.aster]
enabled = true              # keys: the main wallet address and the private key of an API wallet made for it, never the main wallet's key

[exchanges.bingx]
enabled = true

[exchanges.bybit]
enabled = true

[exchanges.bitget]
enabled = true              # keys: API key, secret and the passphrase set when the key was made

[exchanges.kucoin]
enabled = true              # keys: API key, secret and the passphrase set when the key was made

[exchanges.hyperliquid]
enabled = true              # keys: the main wallet address and the private key of an API wallet made for it; quotes are in USDC

[exchanges.variational]
enabled = true              # read-only: Variational Omni has no trading API yet, its gaps are shown but cannot be opened
poll_ms = 2000              # public statistics limit is 10 requests per 10 seconds per IP
max_quote_age_ms = 30000    # public quotes come from a cache and are about a minute old: older than this they never make a gap

[instruments]
refresh_interval_s = 3600   # contracts, steps and pairs reload
max_price_gap_pct = 20      # wider per-token price gap means a wrong multiplier or a different token
max_index_gap_pct = 1       # wider index gap marks the pair suspicious until verified by hand

[feed]
size_usd = 100                  # size per leg; converted into the same token count on both exchanges
min_roi_pct = 1.00              # net ROI by book, after round-trip taker fees, to enter the feed.
                                # Measured over 840 recorded gaps (23.09.2026): below 1 % only 3 in 100 would have
                                # paid even at the best possible exit, and they were three quarters of the flow.
                                # Above 2 %, 69 in 100 would have paid. The radar still shows what is below.
candidate_margin_pct = 0.50     # pairs this close to the threshold by best prices get order-book subscriptions
book_limit = 120                # pairs with live order books at once: the number of gaps measured by book, not by top price
tracking_limit = 20             # of those, at most this many follow gaps that left the feed until prices converge
radar_rows = 40                 # coins with the best current spreads shown under the feed even below the threshold
funding_horizon_h = 8           # hours of funding counted into the expected result of a gap
fresh_ms = 1000                 # a leg whose book changed longer ago than this greys the row out...
quiet_book_max_ms = 10000       # ...unless the exchange's best prices, received after the book, still match it: books are pushed only on change
resubscribe_after_ms = 5000     # no book this long after subscribing, or older than quiet_book_max_ms: subscribe again
tick_ms = 200
enter_after_ms = 30000          # a gap near the threshold must live this long (dips under 2 s tolerated) before the feed
enter_min_samples = 5           # ...and be measured above the threshold this many times. Time alone lets a pair whose
                                # books went quiet ride out the wait on one lucky reading; readings prove a live market
# The wait proves a gap can be clicked, not that it is real: index agreement, depth and the weaker leg's volume do that.
# A gap far above the threshold is both the one worth taking and the one that converges fastest, so it waits less.
fast_enter_multiple = 2         # at this many times min_roi_pct (2 × 1.00 % = 2 %)...
fast_enter_after_ms = 5000      # ...the gap only has to hold this long. 0 in the multiple turns the fast path off
exit_hysteresis_pct = 0.10
exit_after_ms = 2000
default_taker_fee_binance_pct = 0.05   # used until an accepted key check reports the account rate
default_taker_fee_mexc_pct = 0.08     # API-торговля на MEXC тарифицируется отдельно: 0,05% на запуске,
                                      # 0,06% с 01.05.2026, 0,08% с 01.06.2026. Ставка аккаунта, если биржа её
                                      # отдаст после проверки ключа, заменяет это значение
default_taker_fee_gate_pct = 0.075     # Gate contract default taker rate
default_taker_fee_aster_pct = 0.035    # Aster Pro taker rate
default_taker_fee_bingx_pct = 0.05     # BingX contract default taker rate
default_taker_fee_bybit_pct = 0.055    # Bybit non-VIP taker rate
default_taker_fee_bitget_pct = 0.06    # Bitget futures default taker rate
default_taker_fee_kucoin_pct = 0.06    # KuCoin futures default taker rate
default_taker_fee_hyperliquid_pct = 0.045  # Hyperliquid base tier taker rate
default_taker_fee_variational_pct = 0  # Variational charges no fees, it earns on the spread already inside its quotes
mexc_ticker_poll_ms = 1000      # MEXC best prices come from REST: the all-symbols websocket has no bid/ask
gate_ticker_poll_ms = 1000      # Gate best prices, mark, index and volume of all contracts in one REST answer
bingx_ticker_poll_ms = 1000     # BingX best prices from REST: its websocket bookTicker lags behind the order book
bingx_premium_poll_ms = 5000    # BingX mark and index prices
bybit_ticker_poll_ms = 1000     # Bybit best prices, mark, index and volume from REST
bitget_ticker_poll_ms = 1000    # Bitget best prices, mark, index and volume from REST
kucoin_ticker_poll_ms = 1000    # KuCoin best prices from REST; mark, index and volume every minute
hyperliquid_poll_ms = 2000      # Hyperliquid impact prices, mark, oracle and volume (weight 20 of 1,200 a minute)

[portfolio]
positions_poll_s = 5            # positions from REST; needs keys
balances_poll_s = 60
funding_poll_s = 300
liquidation_warning_pct = 10    # warn when a leg is this close to its liquidation price

[trading]
# Master switch. While false, Open and Close send nothing. Turn on only after the trial trade (scripts/trial_trade.py)
# passed on both exchanges and the account check accepted both keys.
enabled = false
leverage_binance = 3
leverage_mexc = 3
leverage_gate = 3
leverage_aster = 3
leverage_bingx = 3
leverage_bybit = 3
leverage_bitget = 3
leverage_kucoin = 3
leverage_hyperliquid = 3
isolated = true                 # isolated margin on both legs; false means cross
entry_min_roi_pct = 1.00        # net ROI by book at the moment of the click; below it no orders leave
max_open_pairs = 3
max_total_usd = 5000            # notional per leg summed over open pairs
one_pair_per_token = true
margin_buffer_pct = 20          # free margin must cover size / leverage plus this buffer on each exchange
status_query_attempts = 10      # an order with unknown outcome is queried this many times...
status_query_interval_ms = 1000 # ...this far apart, before the pair stays "opening" with an alarm
fast_trading = true             # one click opens or closes a pair. false asks for confirmation first;
                                # the switch is also in Настройки → Торговля and applies without a restart
close_attempts = 3
close_retry_pause_ms = 300
maintenance_block_s = 60        # after a maintenance answer the exchange is blocked for new pairs this long
warmup_retry_s = 60

[logging]
level = "INFO"

[telegram]
# Уведомления о вилках туда, где их видно без компьютера. Токен бота — не здесь: он лежит в хранилище
# ключей системы под именем telegram:bot_token (на сервере — в переменной окружения, см. docs/SERVER.md).
enabled = false
chats = []                      # кому слать: ["480399842", "-1001234567890"]; каждый сначала пишет боту сам
min_interest = 0                # слать только пары с интересом не ниже (0 — слать всё, что прошло фильтры ленты)
# min_total_pct = 1.5           # и только с итогом не ниже, в процентах
quiet_hours = ""                # окно тишины по времени машины, например "23:00-08:00"; аварии приходят всегда
digest_at = "09:00"             # ежедневная сводка; пусто — не слать
alarms = true                   # обрывы связи, недоступная база, потерянная нога
send_outcome = true             # дописывать в то же сообщение, чем кончилась вилка
max_messages_per_hour = 60      # потолок на случай шторма; 0 — без потолка
